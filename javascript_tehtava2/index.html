<!DOCTYPE html>
<html>
<head>
    <meta charset = "UTF-8">
    <title>Javascript - Tehtävä 2</title>
</head>
<body>
    <h2>Javascript - Tehtävä 2</h2>
    <p id="nimi"></p>
    <p id="ika"></p>
    <p id="opiskelupaikka"></p>
    <p id="etunimi"></p>
    <p id="ika2"></p>
    <p id="paikkakunta"></p>
    <p id="summa"></p>
    <p id="erotus"></p>
    <p id="tulo"></p>
    <p id="jako"></p>
    <p id="summa2"></p>
    <p id="erotus2"></p>
    <p id="tulo2"></p>
    <p id="jako2"></p>
    <p id="kuluneetvuodet"></p>

    <script>
        document.getElementById("nimi").innerHTML = "<h4>Daniel Mäkelä</h4>";
        document.getElementById("ika").innerHTML = "<h4>26-vuotias</h4>";
        document.getElementById("opiskelupaikka").innerHTML = "<h4>Koulutuskeskus Salpaus</h4>";
        
        // lisää etunimen ja tulostaa sen sivulle
        let firstName = "Daniel";

        document.getElementById("etunimi").innerHTML = firstName;

        // lisää iän ja tulostaa sivulle
        let age = "26";

        document.getElementById("ika2").innerHTML = age;

        // lisää paikkakunnan ja tulostaa sivulle
        let region = "Lahti";

        document.getElementById("paikkakunta").innerHTML = region;

        // lasku jonka summa on 25. x ja y lasketaan yhteen, jonka vastaus on z, joka tulostetaan sivulle
        {
        let x = 12.5;
        let y = 12.5;
        let z = x + y;
        document.getElementById("summa").innerHTML = z;
        }

        // lasku jonka vähennys on yhtä kuin 25. x:stä vähennetään y, vastauksena on z
        {
        let x = 50;
        let y = 25;
        let z = x - y;
        document.getElementById("erotus").innerHTML = z;
        }

        // kertolasku jonka lopputulos on 25, x ja y kerrotaan yhteen, vastauksena z
        {
        let x = 5;
        let y = 5;
        let z = x * y;
        document.getElementById("tulo").innerHTML = z;
        }

        // jakolasku jonka lopputulos on 25. x jaetaan y:llä, jonka vastaus on z, joka tulostetaan sivulle
        {
        let x = 100;
        let y = 4;
        let z = x / y;
        document.getElementById("jako").innerHTML = z;
        }

        // lasku jonka summa on 7
        {
        let x = 3.5;
        let y = 3.5;
        let z = x + y;
        document.getElementById("summa2").innerHTML = z;
        }

        // lasku jonka vähennys on yhtä kuin 7
        {
        let x = 14;
        let y = 7;
        let z = x - y;
        document.getElementById("erotus2").innerHTML = z;
        }

        // kertolasku jonka lopputulos on 7
        {
        let x = 3.5;
        let y = 2;
        let z = x * y;
        document.getElementById("tulo2").innerHTML = z;
        }

        // jakolasku jonka lopputulos on 25
        {
        let x = 70;
        let y = 10;
        let z = x / y;
        document.getElementById("jako2").innerHTML = z;
        }

        // kuinka monta vuotta on kulunut vuodesta 2000. x on nykyvuosi ja y on mistä vähennetään
        {
            let x = 2026;
            let y = 2000;
            let z = x - y;
            document.getElementById("kuluneetvuodet").innerHTML = z + " vuotta kulunut";
        }
        


    </script>

</body>
</html>
