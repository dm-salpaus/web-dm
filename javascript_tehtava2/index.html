<body>

        document.getElementById("nimi").innerHTML = "<h4>Daniel Mäkelä</h4>";

        document.getElementById("opiskelupaikka").innerHTML = "<h4>Koulutuskeskus Salpaus</h4>";
        
        let firstName = "Daniel";

        document.getElementById("etunimi").innerHTML = firstName;

        let age = "26";

        document.getElementById("ika2").innerHTML = age;

        document.getElementById("paikkakunta").innerHTML = region;

        {
        let x = 12.5;
        let y = 12.5;
        let z = x + y;
        document.getElementById("summa").innerHTML = z;
        }

        {
        let x = 50;
        let y = 25;
        let z = x - y;
        document.getElementById("erotus").innerHTML = z;
        }
        
        {
        let x = 5;
        let y = 5;
        let z = x * y;
        document.getElementById("tulo").innerHTML = z;
        }

        {
        let x = 100;
        let y = 4;
        let z = x / y;
        document.getElementById("jako").innerHTML = z;
        }

        


    </script>
