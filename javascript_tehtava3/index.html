<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Javascript perusteet - Tehtävä 3</title>
    </head>
    <body>
        <h2>Javascript perusteet - Tehtävä 3</h2>
        <p id="temperature"></p>
        <p id="number"></p>
        <p id="password"></p>
        <script>
            const lampotila = -5;
            let temp;
            if (lampotila < 0) {
                temp = "Pakkasta";
            } else {
                temp = "Ei pakkasta";
            }

            const numero = 15;
            let num;
            if (numero < 10) {
                num = "Pieni numero";
            } else {
                if (numero <= 20) {
                    num = "Keskikokoinen numero";
                } else {
                    if (numero > 20) {
                        num = "Suuri numero";
                    }
                }
            }

            const salasana = "hikke1337";
            let pass;
            if (salasana === "javascript123") {
                pass = "Salasana oikein";
            } else {
                pass = "Salasana väärin";
            }





            document.getElementById("temperature").innerHTML = temp;
            document.getElementById("number").innerHTML = num;
            document.getElementById("password").innerHTML = pass;
            
        </script>
    </body>
</html>
